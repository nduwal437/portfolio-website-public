name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build -- --configuration production

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 16.x
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean old build and preserve CNAME
        run: |
          cp docs/CNAME /tmp/CNAME_BACKUP 2>/dev/null || true
          rm -rf docs/*

      - name: Build for GitHub Pages
        run: npm run build:gh-pages

      - name: Restore CNAME and create 404.html
        run: |
          cp /tmp/CNAME_BACKUP docs/CNAME 2>/dev/null || true
          cp docs/index.html docs/404.html

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy: update docs/ from build"
          git push
