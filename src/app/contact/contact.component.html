<div class="contact-container">
  <div class="page-header">
    <h1>Contact Me</h1>
    <p>I'd love to hear from you! Get in touch using the form below or through any of the contact methods.</p>
  </div>

  <form class="form-container" #contactForm="ngForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required ngModel>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required ngModel>
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required ngModel>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" required ngModel></textarea>
    </div>

    <button type="submit" class="btn btn-primary btn-full-width" [disabled]="!contactForm.valid">
      Send Message
    </button>
  </form>

</div>
