<div class="page-container">
  <div class="page-header">
    <a routerLink="/games/chess/blindfold/board-geometry" class="breadcrumb-link">&larr; Board Geometry</a>
    <h1>Same-Color Pair</h1>
    <p>Are these two squares the same color, or different?</p>
  </div>

  <div class="drill-card">
    <div class="score" aria-live="polite">
      <span class="score-value">{{ correctCount }} / {{ totalCount }}</span>
      <span class="score-accuracy" *ngIf="totalCount > 0">({{ accuracy }}%)</span>
    </div>

    <div class="square-prompt" aria-label="Square pair">
      <span>{{ squareA }}</span>
      <span class="prompt-sep">·</span>
      <span>{{ squareB }}</span>
    </div>

    <div class="answer-buttons">
      <button type="button" class="answer-btn answer-same" (click)="answer('same')" [disabled]="!awaitingAnswer">
        Same
      </button>
      <button
        type="button"
        class="answer-btn answer-different"
        (click)="answer('different')"
        [disabled]="!awaitingAnswer"
      >
        Different
      </button>
    </div>

    <div
      class="feedback"
      *ngIf="feedback"
      [class.feedback-correct]="feedback.correct"
      [class.feedback-wrong]="!feedback.correct"
      role="status"
    >
      {{ feedback.message }}
    </div>

    <div class="actions">
      <button type="button" class="next-btn" (click)="nextRound()" [disabled]="awaitingAnswer">Next pair</button>
      <button type="button" class="reset-btn" (click)="reset()">Reset score</button>
    </div>
  </div>
</div>
