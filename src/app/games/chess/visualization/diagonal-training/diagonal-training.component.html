<div class="page-container">
  <div class="page-header">
    <a routerLink="/games/chess/visualization/board-geometry" class="breadcrumb-link">&larr; Board Geometry</a>
    <h1>Diagonal Naming</h1>
    <p>Which square lies on a diagonal from the prompt square?</p>
  </div>

  <div class="drill-card">
    <div class="score" aria-live="polite">
      <span class="score-value">{{ correctCount }} / {{ totalCount }}</span>
      <span class="score-accuracy" *ngIf="totalCount > 0">({{ accuracy }}%)</span>
    </div>

    <div class="square-prompt" aria-label="Prompt square">
      {{ square }}
    </div>

    <div class="option-grid">
      <button
        type="button"
        class="option-btn"
        *ngFor="let option of options; trackBy: trackByOption"
        [ngClass]="optionClass(option)"
        (click)="answer(option)"
        [disabled]="!awaitingAnswer"
      >
        {{ option }}
      </button>
    </div>

    <div
      class="feedback"
      *ngIf="feedback"
      [class.feedback-correct]="feedback.correct"
      [class.feedback-wrong]="!feedback.correct"
      role="status"
    >
      {{ feedback.message }}
    </div>

    <div class="actions">
      <button type="button" class="next-btn" (click)="nextRound()" [disabled]="awaitingAnswer">Next square</button>
      <button type="button" class="reset-btn" (click)="reset()">Reset score</button>
    </div>
  </div>
</div>
