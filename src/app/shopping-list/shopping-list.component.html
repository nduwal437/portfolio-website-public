<div class="shopping-list-container">
  <div class="shopping-list-header">
    <h2 class="shopping-list-title">Shopping List</h2>
    <a routerLink="/" class="back-button">Back to Home</a>
  </div>

  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

  <form (ngSubmit)="addItem()" class="add-item-form">
    <input 
      type="text" 
      [(ngModel)]="newItemName" 
      name="newItemName" 
      placeholder="Add new item..." 
      class="add-item-input"
      [disabled]="isLoading"
    >
    <button 
      type="submit" 
      class="add-item-button"
      [disabled]="isLoading || !newItemName.trim()"
    >
      Add Item
    </button>
  </form>

  <div class="loading-spinner" *ngIf="isLoading">
    Loading...
  </div>

  <ul class="shopping-items-list" *ngIf="!isLoading">
    <li *ngFor="let item of shoppingItems" class="shopping-item">
      <div class="item-container">
        <input 
          type="checkbox" 
          [checked]="item.is_needed" 
          (change)="toggleItemStatus(item)" 
          [disabled]="isLoading"
          class="item-checkbox"
        >
        <span class="item-name" [class.completed]="item.is_needed">{{ item.name }}</span>
      </div>
      <button 
        (click)="deleteItem(item.id)" 
        class="delete-button"
        [disabled]="isLoading"
      >
        Delete
      </button>
    </li>
    <li *ngIf="shoppingItems.length === 0" class="no-items-message">
      No items in your shopping list. Add some!
    </li>
  </ul>
</div>
