<div class="shopping-list-container">
  <div class="shopping-list-header">
    <h2 class="shopping-list-title">Shopping List</h2>
    <a routerLink="/" class="back-button">Back to Home</a>
  </div>

  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

  <form (ngSubmit)="addItem()" class="add-item-form">
    <input 
      type="text" 
      [(ngModel)]="newItemName" 
      name="newItemName" 
      placeholder="Add new item..." 
      class="add-item-input"
      [disabled]="isLoading"
    >
    <button 
      type="submit" 
      class="add-item-button"
      [disabled]="isLoading || !newItemName.trim()"
    >
      Add Item
    </button>
  </form>

  <div class="loading-spinner" *ngIf="isLoading">
    Loading...
  </div>

  <div class="shopping-sections" *ngIf="!isLoading">
    <!-- Required Items Section -->
    <div class="shopping-section">
      <h3 class="section-title">Required Items</h3>
      <ul class="shopping-items-list">
        <li *ngFor="let item of requiredItems" class="shopping-item">
          <div class="item-container">
            <input 
              type="checkbox" 
              [checked]="false" 
              (change)="toggleItemStatus(item)" 
              [disabled]="isLoading"
              class="item-checkbox"
            >
            <span class="item-name">{{ item.name }}</span>
          </div>
          <button 
            (click)="deleteItem(item.id)" 
            class="delete-button"
            [disabled]="isLoading"
          >
            Delete
          </button>
        </li>
        <li *ngIf="requiredItems.length === 0" class="no-items-message">
          No required items. All items have been received!
        </li>
      </ul>
    </div>

    <!-- Received Items Section -->
    <div class="shopping-section">
      <h3 class="section-title">Received Items</h3>
      <ul class="shopping-items-list">
        <li *ngFor="let item of receivedItems" class="shopping-item">
          <div class="item-container">
            <input 
              type="checkbox" 
              [checked]="true" 
              (change)="toggleItemStatus(item)" 
              [disabled]="isLoading"
              class="item-checkbox"
            >
            <span class="item-name completed">{{ item.name }}</span>
          </div>
          <button 
            (click)="deleteItem(item.id)" 
            class="delete-button"
            [disabled]="isLoading"
          >
            Delete
          </button>
        </li>
        <li *ngIf="receivedItems.length === 0" class="no-items-message">
          No received items yet.
        </li>
      </ul>
    </div>
  </div>
</div>
